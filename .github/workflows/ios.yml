name: iOS CI

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------------------
      # Setup
      # ---------------------------
      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS Dependencies
        run: yarn install --frozen-lockfile

      # ---------------------------
      # CocoaPods
      # ---------------------------
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install

      # ---------------------------
      # Signing Setup
      # ---------------------------
      - name: Create Temporary Keychain
        run: |
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Import Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k temp123 \
            build.keychain

      - name: Install Provisioning Profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Show Signing Identities
        run: security find-identity -v -p codesigning

      # ---------------------------
      # ARCHIVE (Removed 'clean' step so RN files are preserved)
      # ---------------------------
      - name: Archive iOS App
        run: |
          cd ios

          xcodebuild archive \
            -workspace TaskByte.xcworkspace \
            -scheme TaskByte\ Staging \
            -configuration Release-Staging \
            -sdk iphoneos \
            -archivePath build/TaskByte.xcarchive

      # ---------------------------
      # CREATE EXPORT OPTIONS
      # ---------------------------
      - name: Create Export Options
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.gopendra.taskbyte</key>
              <string>TaskByte Distribution Provisioning Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ---------------------------
      # EXPORT IPA
      # ---------------------------
      - name: Export IPA
        run: |
          cd ios

          xcodebuild -exportArchive \
            -archivePath build/TaskByte.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      # ---------------------------
      # VERIFY OUTPUT
      # ---------------------------
      - name: Check IPA Output
        run: |
          ls -R ios/build/export

      # ---------------------------
      # UPLOAD ARTIFACT
      # ---------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/export/*.ipa

      # ---------------------------
      # TESTFLIGHT UPLOAD
      # ---------------------------
      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p private_keys

          # The fix is here: dynamically name the file AuthKey_YOURKEYID.p8
          echo "$APPSTORE_PRIVATE_KEY" > private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          xcrun altool --upload-app \
            -f ios/build/export/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
