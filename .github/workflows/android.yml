name: Android CI

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore properties
        run: |
          cat > android/app/keystore.properties <<EOF
          STORE_FILE=release.keystore
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleStagingRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskbyte-staging-apk
          path: android/app/build/outputs/apk/staging/release/*.apk

      - name: Upload to Firebase
        run: |
          npx firebase-tools appdistribution:distribute \
          android/app/build/outputs/apk/staging/release/app-staging-release.apk \
          --app ${{ secrets.FIREBASE_APP_ID_STAGING }} \
          --groups Testers \
          --token ${{ secrets.FIREBASE_TOKEN }}
